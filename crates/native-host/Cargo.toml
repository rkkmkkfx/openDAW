[package]
name = "native-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
native-clap = {path = "../native-clap"}
native-vst3 = {path = "../native-vst3"}
native-render = {path = "../native-render"}
engine-env = {path = "../engine-env"}
clap = {version = "4.5", features = ["derive"]}
hound = "3.5"
serde = {version = "1", features = ["derive"]}
serde_json = "1"
engine = {path = "../engine", features = ["native"]}
zip = {version = "2", default-features = false, features = ["deflate"]}
libc = "0.2"
clap-sys = "=0.5.0"
